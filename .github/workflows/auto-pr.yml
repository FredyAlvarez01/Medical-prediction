name: CI/CD Pipeline Autochain

on:
  push:
    branches:
      - anadir-github-actions

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Crear o reutilizar PR
      - name: Gestionar PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:anadir-github-actions`,
              base: "main",
              state: "open"
            });

            let pr;

            if (prs.data.length > 0) {
              pr = prs.data[0];
            } else {
              const nuevo = await github.rest.pulls.create({
                owner,
                repo,
                title: "PR automático",
                head: "anadir-github-actions",
                base: "main",
                body: "Creado automáticamente"
              });

              pr = nuevo.data;
            }

            core.setOutput("pr_number", pr.number);

      # Comentario inicio
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: "CI/CD en acción. Ejecutando tareas …"
            });

      # Evento 1 -> Tests PR
      - run: pytest -v
        env:
          PYTHONPATH: .

      # Comentario éxito
      - if: success()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: "CI/CD terminado con éxito."
            });

      # Merge automático
      - if: success()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
              merge_method: "squash"
            });

      # Evento 2 -> Verificación final en main
      - run: |
          git fetch origin main
          git checkout main

      - run: pytest -v
        env:
          PYTHONPATH: .

      - run: |
          echo "## 🚀 Verificación Final Exitosa" >> $GITHUB_STEP_SUMMARY