name: CI/CD Pipeline Autochain

on:

  # EVENTO 1 -> PR HACIA MAIN
  pull_request:
    branches:
      - main

  # EVENTO 2 -> PUSH A MAIN
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:

  # ==========================================================
  # EVENTO 1: VALIDACIÓN DEL PR
  # ==========================================================
  evento-1-pr-validation:

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Comentario inicio
      - name: Comentar inicio en el PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "CI/CD en acción. Ejecutando tareas …"
            });

      # Tests PR
      - name: Ejecutar pruebas unitarias
        env:
          PYTHONPATH: .
        run: pytest -v

      # Comentario éxito
      - name: Comentar éxito en el PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "CI/CD terminado con éxito."
            });

      # Merge automático
      - name: Merge automático
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: "squash"
            });

  # ==========================================================
  # EVENTO 2: VALIDACIÓN FINAL EN MAIN
  # ==========================================================
  evento-2-main-verification:

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Tests finales en main
      - name: Re-ejecutar pruebas unitarias en Main
        env:
          PYTHONPATH: .
        run: pytest -v

      # Reporte final
      - name: Generar reporte final
        run: |
          echo "## 🚀 Verificación Post-Merge en Main Exitosa" >> $GITHUB_STEP_SUMMARY