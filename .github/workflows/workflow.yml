name: CI/CD Pipeline Autochain

on:
  push:
    branches:
      - anadir-github-actions

permissions:
  contents: write
  pull-requests: write

jobs:
  # =========================================================
  # 1. TESTS
  # =========================================================
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        env:
          PYTHONPATH: .
        run: pytest -v

  # =========================================================
  # 2. CREAR PR
  # =========================================================
  create-pr:
    needs: tests
    runs-on: ubuntu-latest

    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}

    steps:
      - name: Crear o reutilizar PR
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:anadir-github-actions`,
              base: "main",
              state: "open"
            });

            let pr;

            if (existing.data.length > 0) {
              pr = existing.data[0];
            } else {
              pr = await github.rest.pulls.create({
                owner,
                repo,
                title: "PR automático anadir-github-actions → main",
                head: "anadir-github-actions",
                base: "main",
                body: "Creado automáticamente desde GitHub Actions"
              });
            }

            core.setOutput("pr_number", pr.data.number);

  # =========================================================
  # 3. TEST EN PR (RE-EJECUCIÓN REAL)
  # =========================================================
  tests-pr:
    needs: create-pr
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: anadir-github-actions # 👈 CLAVE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Ejecutar tests
        env:
          PYTHONPATH: .
        run: pytest -v

  # =========================================================
  # 3. MERGE
  # =========================================================
  merge-pr:
    needs: tests-pr
    runs-on: ubuntu-latest

    steps:
      - name: Debug PR number
        run: echo "PR NUMBER ${{ needs.create-pr.outputs.pr_number }}"

      - name: Merge PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);

            if (!prNumber) {
              core.setFailed("No se encontró PR");
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: "squash"
              });
            } catch (e) {
              core.setFailed("Merge falló: " + e.message);
            }
