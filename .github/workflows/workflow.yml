name: CI/CD Pipeline Autochain

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ======================================================================
  # TRABAJO 1: VALIDACIÓN DEL PULL REQUEST
  # ======================================================================
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Comentar inicio
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 CI/CD en acción. Ejecutando pruebas automáticas...'
            })

      - name: Ejecutar pruebas iniciales
        env:
          PYTHONPATH: .
        run: |
          pytest -v test_predict.py

      - name: Comentar éxito inicial
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Validación inicial completada con éxito.'
            })

      - name: Comentar fallo
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Las pruebas iniciales fallaron. Revisar logs del workflow.'
            })

  # ======================================================================
  # TRABAJO 2: RE-VERIFICACIÓN AUTOMÁTICA
  # ======================================================================
  re-verification:
    runs-on: ubuntu-latest
    needs: validate-pr

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Re-ejecutar pruebas unitarias
        env:
          PYTHONPATH: .
        run: |
          pytest -v test_predict.py

      - name: Generar resumen final
        if: success()
        run: |
          echo "## 🚀 Verificación Automática Terminada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "La segunda validación fue ejecutada correctamente." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✔️ Todas las pruebas finalizaron sin errores." >> $GITHUB_STEP_SUMMARY
