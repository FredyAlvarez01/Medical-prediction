name: CI/CD Pipeline Autochain

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ======================================================================
  # TRABAJO 1: VALIDACIÓN DEL PULL REQUEST
  # ======================================================================
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Comentar inicio
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'CI/CD en acción. Ejecutando tareas …'
            })

      - name: Ejecutar pruebas iniciales
        env:
          PYTHONPATH: .
        run: |
          pytest

       Tarjeta de éxito en la conversación del PR
      - name: Comentar éxito inicial
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'CI/CD terminado con éxito.'
            })

  # ======================================================================
  # TRABAJO 2: RE-VERIFICACIÓN AUTOMÁTICA (Corre solo si el Trabajo 1 pasa)
  # ======================================================================
  re-verification:
    runs-on: ubuntu-latest
    needs: validate-pr # <-- ESTA LÍNEA OBLIGA A SEGUIR LA SECUENCIA AUTOMÁTICAMENTE
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Re-ejecutar pruebas unitarias (Validación final)
        env:
          PYTHONPATH: .
        run: |
          pytest

      - name: Generar reporte de ejecución final
        if: success()
        run: |
          echo "## 🚀 Verificación Automática Terminada" >> $GITHUB_STEP_SUMMARY
          echo "El segundo bloque de pruebas ha concluido inmediatamente después de la validación." >> $GITHUB_STEP_SUMMARY