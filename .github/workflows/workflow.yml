name: CI/CD Pipeline Autochain

on:
  push:
    branches:
      - anadir-github-actions

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ======================================================================
  # EVENTO 1: PRUEBAS Y GESTIÓN DEL PULL REQUEST
  # ======================================================================
  evento-1-pr-validation:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.gestionar_pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # CORREGIDO: Manejo robusto de extracción del número de PR
      - name: Crear o reutilizar PR
        id: gestionar_pr
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const existing = await github.rest.pulls.list({
              owner, repo, head: `${owner}:anadir-github-actions`, base: "main", state: "open"
            });
            
            let prNumber;
            
            if (existing.data.length > 0) {
              // Si ya existe, extraemos el número directamente del elemento de la lista
              prNumber = existing.data[0].number;
              console.log(`PR existente encontrado: #${prNumber}`);
            } else {
              // Si no existe, lo creamos y extraemos desde pr.data.number
              const newPr = await github.rest.pulls.create({
                owner, repo, title: "PR automático anadir-github-actions → main",
                head: "anadir-github-actions", base: "main", body: "Creado automáticamente por el pipeline."
              });
              prNumber = newPr.data.number;
              console.log(`Nuevo PR creado con éxito: #${prNumber}`);
            }
            
            // Enviamos el output limpio al entorno global del job
            core.setOutput("pr_number", prNumber);

      # REQUISITO: Comentario de INICIO exigido por la rúbrica
      - name: Comentar inicio en el PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.gestionar_pr.outputs.pr_number }}
        with:
          script: |
            const prNum = Number(process.env.PR_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
              body: "CI/CD en acción. Ejecutando tareas …"
            });

      # REQUISITO: Ejecución de las pruebas unitarias
      - name: Ejecutar pruebas unitarias (Fase PR)
        env:
          PYTHONPATH: .
        run: pytest -v

      # REQUISITO: Comentario de ÉXITO exigido por la rúbrica
      - name: Comentar éxito en el PR
        if: success()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.gestionar_pr.outputs.pr_number }}
        with:
          script: |
            const prNum = Number(process.env.PR_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
              body: "CI/CD terminado con éxito."
            });

  # ======================================================================
  # CIERRE INTERMEDIO: FUSIÓN DE CÓDIGO AUTOMÁTICA
  # ======================================================================
  execute-merge:
    needs: evento-1-pr-validation
    runs-on: ubuntu-latest
    steps:
      - name: Fusionar PR automáticamente (Squash)
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.evento-1-pr-validation.outputs.pr_number }}
        with:
          script: |
            const prNum = Number(process.env.PR_NUMBER);
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNum,
              merge_method: "squash"
            });

  # ======================================================================
  # EVENTO 2: VERIFICACIÓN FINAL (Post-Merge sobre la rama MAIN unificada)
  # ======================================================================
  evento-2-main-verification:
    needs: execute-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias en Main
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Re-ejecutar pruebas unitarias en Main (Control de calidad)
        env:
          PYTHONPATH: .
        run: pytest -v

      - name: Generar Reporte Final de Ejecución (Evidencia para el profesor)
        run: |
          echo "## 🚀 Verificación Post-Merge en Main Exitosa" >> $GITHUB_STEP_SUMMARY
          echo "El código ha sido transferido y re-evaluado en \`main\` de forma 100% automática." >> $GITHUB_STEP_SUMMARY