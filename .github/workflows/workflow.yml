name: CI/CD Pipeline Autochain

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  push:
    branches-ignore:
      - main

  workflow_dispatch:

jobs:
  pipeline-automatico:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. PREPARACIÓN
      # ==========================================================
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # ==========================================================
      # 2. CREAR/BUSCAR PR
      # ==========================================================
      - name: Crear o buscar PR
        id: pr_fase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          PR_URL=$(gh pr list \
            --head ${{ github.ref_name }} \
            --json url \
            --jq '.[0].url')

          if [ -z "$PR_URL" ]; then

            PR_URL=$(gh pr create \
              --title "PR automático: ${{ github.ref_name }}" \
              --body "Creado automáticamente por CI/CD" \
              --base main \
              --head ${{ github.ref_name }})

          fi

          PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$' | tail -n1)

          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT

      # ==========================================================
      # 3. COMENTARIO INICIAL
      # ==========================================================
      - name: Comentar inicio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment \
          ${{ steps.pr_fase.outputs.pr_number }} \
          --body "CI/CD en acción. Ejecutando tareas …"

      # ==========================================================
      # 4. TESTS
      # ==========================================================
      - name: Ejecutar pruebas unitarias
        env:
          PYTHONPATH: .
        run: pytest -v

      # ==========================================================
      # 5. COMENTARIO FINAL
      # ==========================================================
      - name: Comentar éxito
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment \
          ${{ steps.pr_fase.outputs.pr_number }} \
          --body "CI/CD terminado con éxito."

      # ==========================================================
      # 6. MERGE AUTOMÁTICO
      # ==========================================================
      - name: Merge automático
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge \
          ${{ steps.pr_fase.outputs.pr_number }} \
          --squash \
          --delete-branch

      # ==========================================================
      # 7. VALIDACIÓN FINAL EN MAIN
      # ==========================================================
      - name: Cambiar a main
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Re-ejecutar pruebas en main
        env:
          PYTHONPATH: .
        run: pytest -v