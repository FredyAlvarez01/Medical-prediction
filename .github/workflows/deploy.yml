name: CD Pipeline Deployment

permissions:
  contents: read

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  production-check:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      # ----------------------------------------------------------------------
      # RE-VERIFICACIÓN LÓGICA: Control de calidad final en main
      # ----------------------------------------------------------------------
      - name: Re-ejecutar pruebas unitarias en Main
        env:
          PYTHONPATH: .
        run: |
          pytest

      # ----------------------------------------------------------------------
      # MENSAJE DE EJECUCIÓN FINAL (Solo se genera si pytest pasa con éxito)
      # ----------------------------------------------------------------------
      - name: Generar reporte de ejecución final
        if: success()
        run: |
          echo "## 🚀 Verificación en Main Terminada con Éxito" >> $GITHUB_STEP_SUMMARY
          echo "El llamado a las pruebas unitarias sobre la rama principal ha concluido correctamente." >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Resumen de tareas:" >> $GITHUB_STEP_SUMMARY
          echo "- **Re-verificación lógica (pytest):** Ejecutada y aprobada en el entorno unificado de \`main\`." >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo "✔️ *El código existente en la rama principal se encuentra libre de errores funcionales.*" >> $GITHUB_STEP_SUMMARY